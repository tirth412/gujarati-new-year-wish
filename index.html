<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>नूतन वर्षाभिनंदन 🪔</title>
  <meta name="description" content="Gujarati New Year (Bestu Varas) wishes — नूतन वर्षाभिनंदन • નૂતન વર્ષાભિનંદન">
  <meta property="og:title" content="नूतन वर्षाभिनंदन • નૂતન વર્ષાભિનંદન 🪔">
  <meta property="og:description" content="A special New Year wish for you ✨">
  <meta name="theme-color" content="#4a0d1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang="hi">हिं</button>
    <button data-lang="gu">ગુજ</button>
    <button data-lang="en">EN</button>
  </div>

  <!-- Opening screen: light all the diyas -->
  <section id="intro" class="screen active">
    <p class="intro-title" data-i18n="introTitle"></p>
    <p class="intro-sub" data-i18n="introSub"></p>
    <div id="diyaRow" class="diya-row"></div>
    <p id="diyaCount" class="diya-count">0 / 5</p>
    <button id="skipBtn" class="link-btn" data-i18n="skip"></button>
  </section>

  <!-- Wish screen -->
  <main id="wish" class="screen">
    <div id="card" class="card">
      <div id="rangoli" class="rangoli" aria-hidden="true"></div>
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <p id="greeting" class="greeting"></p>
      <p class="om">ॐ</p>
      <p id="toName" class="to-name"></p>
      <h1 class="title" data-i18n="title"></h1>
      <p class="gu" data-i18n="sub"></p>
      <p class="samvat" data-i18n="samvat"></p>
      <div class="divider"><span>🪔</span></div>
      <p id="message" class="message"></p>
      <p id="saal" class="saal" data-i18n="saal"></p>
    </div>

    <p class="hint" data-i18n="hint"></p>

    <div class="actions">
      <button id="newBtn" class="btn primary" data-i18n="newBtn"></button>
      <button id="replayBtn" class="btn ghost" data-i18n="replayBtn"></button>
      <button id="saveBtn" class="btn ghost" data-i18n="saveBtn"></button>
      <button id="muteBtn" class="btn ghost"></button>
    </div>
    <p id="saveNote" class="note" aria-live="polite"></p>

    <section class="share">
      <h2 data-i18n="shareTitle"></h2>
      <label for="nameInput" data-i18n="nameLabel"></label>
      <input id="nameInput" type="text" data-i18n-ph="namePh" maxlength="40" autocomplete="off">
      <label for="themeSelect" data-i18n="themeLabel"></label>
      <select id="themeSelect">
        <option value="" data-i18n="th_general"></option>
        <option value="family" data-i18n="th_family"></option>
        <option value="wealth" data-i18n="th_wealth"></option>
        <option value="health" data-i18n="th_health"></option>
        <option value="success" data-i18n="th_success"></option>
        <option value="friends" data-i18n="th_friends"></option>
      </select>
      <label for="langSelect" data-i18n="langLabel"></label>
      <select id="langSelect">
        <option value="hi">हिन्दी</option>
        <option value="gu">ગુજરાતી</option>
        <option value="en">English</option>
      </select>
      <div class="share-row">
        <button id="waBtn" class="btn primary" data-i18n="wa"></button>
        <button id="copyBtn" class="btn ghost" data-i18n="copy"></button>
      </div>
      <p id="copyNote" class="note" aria-live="polite"></p>
    </section>

    <footer>
      <p data-i18n="footer"></p>
      <div class="owner">
        <span class="owner-line"></span>
        <p class="owner-name"><span class="owner-by">Created by</span> Tirth Shah</p>
        <p class="owner-copy">&copy; 2026 Tirth Shah &middot; All rights reserved</p>
      </div>
    </footer>
  </main>

  <audio id="music" src="music.mp3" loop preload="auto"></audio>
  <script type="module" src="track.js"></script>
  <script src="update.js"></script>
  <script src="script.js"></script>
</body>
</html>
